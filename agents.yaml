  # NOT pinned to any of the provider keys opencode can see in env
  # (`opencode auth list` → GROQ / OPENROUTER / CEREBRAS / GEMINI). Its agent
  # harness costs 17-32k tokens per request, measured — roughly 25x a plain
  # completion — so pointing it at a shared free bucket would drain that
  # bucket's daily cap on behalf of an entry that contributes no quota of its
  # own. OpenRouter's key in particular exists for the five openrouter-* free
  # entries and nothing else. groq's 8000 TPM free cap rejects the harness
  # outright ("Request too large"); cerebras answers "Payment required".
  # Pinned to OpenCode Zen's own free hosted model (`opencode/deepseek-v4-flash-free`), NOT
  # to a provider key. Confirmed live with every provider env var this package
  # sets (GROQ/OPENROUTER/CEREBRAS/GEMINI) unset AND `opencode auth list`
  # reporting 0 credentials — Zen's free tier needs neither this package's
  # keys nor `opencode auth login`. That makes this entry's quota bucket
  # genuinely its own, unlike anything else in this registry.
  #
  # Pinning is NOT optional here — the alternative was tried and is worse than
  # merely unusable. Bare `opencode run --auto` (no `-m`) does not fail closed;
  # it round-robins across EVERY authenticated surface it can see, Zen and our
  # provider env vars alike, with zero regard for task fit. Observed on this
  # machine: `opencode/big-pickle` (a Zen model, works), then on the very next
  # call Groq's `whisper-large-v3-turbo` — an audio-transcription model, not a
  # chat model — picked for a plain text-edit prompt and failing outright
  # ("does not support c[hat completions]"). That is exactly the 6-success/
  # 2-fail flakiness this pin exists to remove; an unpinned run is not a
  # smaller, cheaper version of this entry, it is a different and less
  # reliable one.
  #
  # `deepseek-v4-flash-free`, not `big-pickle`, despite both being Zen models
  # with no auth requirement either way: 5/5 clean replies to a trivial "reply
  # exactly OK" probe, vs. 2 empty responses out of 8 for big-pickle and worse
  # for nemotron-3-ultra-free (also leaked chain-of-thought text into the
  # reply). Zen's free tier is rate-limited per-model, and this was clearly the
  # least flaky model reachable through it at measurement time — re-check if
  # `verify-read-only opencode` or the UI's audit starts flapping again.
  - id: opencode
    provider: sst
    model: opencode/deepseek-v4-flash-free
    tier: weak
    tags: [agentic, free]
    auth: "cli:opencode"
    usage_url: "https://opencode.ai/docs/zen/"
    signup_url: "https://opencode.ai"
    docs_url: "https://opencode.ai/docs"
    free_tier:
      description: "OpenCode Zen is opencode's own hosted model routing. Its `deepseek-v4-flash-free` model needs no account, no API key, and no `opencode auth login` — confirmed live with every credential this package sets unset. This entry is pinned to it specifically, both to keep dispatch from ever falling through to a provider key this package also uses for other entries, and because it was the most reliable free Zen model available at measurement time."
      limits: "Per Zen's own docs (opencode.ai/docs/zen), this specific free model is 'available on OpenCode for a limited time' while the team collects feedback — it is promotional, not a permanent tier, and may require a real Zen API key (a paid, pay-as-you-go account) later. No numeric rate limit is published."
      card_required: false
    transports:
      # opencode 1.x, NOT the `opencode -p` of the abandoned pre-1.0 Go CLI that
      # used to shadow this name (that project is now Charm's `crush`). On 1.x
      # `-p` is `--password`, so the old command printed the help banner and
      # exited 0 — work silently never done.
      edit_exists:
        cmd: "opencode run --auto -m opencode/deepseek-v4-flash-free"
        cwd_flag: "--dir {cwd}"
      # `--agent plan` is opencode's own read-only agent. Do NOT substitute
      # `permission: {edit: deny, ...}` in the config for this: with --auto that
      # combination HANGS indefinitely in non-interactive mode (reproduced on
      # 1.18.16 against two separate providers, 100s/150s/300s, no output).
      read_only:
        cmd: "opencode run --auto --agent plan -m opencode/deepseek-v4-flash-free"
        cwd_flag: "--dir {cwd}"

  # Kiro CLI (AWS Kiro Studio's headless chat mode). The trust list must cover
  # every tool the transport promises: `edit_exists` means "edits files in
  # place", so fs_write is required, and execute_bash lets the agent run the
  # acceptance commands (typecheck, git diff) it is asked to report. Trusting
  # fs_read alone does NOT fail — kiro silently degrades to printing the patch
  # as text and exits 0 with no files touched, which reads as a success.
  # Requires prior `kiro-cli login`; state at ~/.aws/sso equivalent.
  - id: kiro
    provider: kiro
    model: default
    tier: strong
    tags: [agentic]
    auth: "cli:kiro-cli"
    signup_url: "https://kiro.dev"
    docs_url: "https://kiro.dev/docs"
    free_tier:
      description: "Kiro CLI authenticates with a Kiro account. The free tier includes a limited monthly credit allowance; paid plans raise it."
      limits: "Free-tier credits are capped per month and reset on the billing cycle."
      card_required: false
    transports:
      edit_exists:
        cmd: "kiro-cli chat --no-interactive --trust-tools=fs_read,fs_write,execute_bash"
        effort_param: flag
        effort_levels: [low, medium, high, xhigh, max]
        effort_flag: "--effort {level}"
        effort_verified: validated
      # Verified with `external-agents verify-read-only kiro`: a canary file
      # was demonstrably unchanged after dispatch. This is the ORIGINAL
      # edit_exists cmd from before this incident — trusting only fs_read is
      # exactly what makes it non-writing.
      read_only:
        cmd: "kiro-cli chat --no-interactive --trust-tools=fs_read"
        effort_param: flag
        effort_levels: [low, medium, high, xhigh, max]
        effort_flag: "--effort {level}"
        effort_verified: validated

