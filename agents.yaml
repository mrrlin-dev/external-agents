  # Claude family — subscription-backed. All non-Fable Claude 5 / Opus 4.x
  # models. `claude-opus-4-8` is the newest strong; `claude-haiku-4-5` is
  # the cheapest weak-tier for atomic-executor + /consensus terminal picks.
  # Fable is intentionally excluded.
  - id: claude-opus-4-8
    provider: anthropic
    model: claude-opus-4-8
    tier: strong
    tags: []
    auth: "cli:claude"
    usage_url: "https://console.anthropic.com/settings/usage"
    signup_url: "https://claude.ai"
    docs_url: "https://docs.claude.com/en/docs/claude-code"
    free_tier:
      description: "Claude Code authenticates with a claude.ai account rather than a metered API key. The free plan includes a limited Claude Code allowance; Pro and Max raise it."
      limits: "Usage limits follow the linked claude.ai plan's Claude Code allowance, which resets on a rolling window."
      card_required: false
    transports:
      edit_exists:
        cmd: "env -u ANTHROPIC_BASE_URL -u ANTHROPIC_API_KEY claude --print --model claude-opus-4-8"
        effort_param: flag
        effort_levels: [low, medium, high, xhigh, max]
        effort_flag: "--effort {level}"
        effort_verified: validated
      # Verified with `external-agents verify-read-only claude-opus-4-8`.
      # NOT `--allowedTools Read,Grep,Glob` — that ADDS permissions on top of
      # the default set rather than restricting to it, and still writes. The
      # trailing `--` is required: without it the variadic --disallowedTools
      # flag swallows the prompt argument and the CLI exits with "Input must
      # be provided". `MultiEdit` must not appear in the deny list; it is not
      # a known tool name and its presence aborts the run.
      # No effort_levels here (deliberately, not an oversight): runDispatch
      # inserts the effort flag right before the prompt, i.e. AFTER this cmd's
      # trailing `--`, and that combination is untested — do not add effort
      # fields until `--effort {level}` has been verified to land before `--`
      # rather than after it.
      read_only:
        cmd: "env -u ANTHROPIC_BASE_URL -u ANTHROPIC_API_KEY claude --print --model claude-opus-4-8 --disallowedTools Write,Edit,NotebookEdit,Bash --"

