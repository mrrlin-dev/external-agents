# External-agents registry v1 (see ADR 0021 in mrrlin repo).
#
# ONE entry per (provider, model). An entry may declare BOTH transports —
# named after WHAT they do reliably (action-oriented):
#   transports.generate_new  — native fetch → OpenAI-compat /chat/completions.
#     Dispatcher writes the response content to workdir/generated.md. Ideal
#     for "produce the contents of this file from spec". Preferred by default.
#     Optional `effort_levels: [...]` declares supported reasoning-effort
#     values for this transport, lowest to highest. Optional
#     `effort_param: top_level|nested|flag` records how the transport wants the
#     setting:
#       top_level → JSON body field `reasoning_effort: "<v>"`
#       nested    → JSON body object `reasoning: { effort: "<v>" }`
#       flag      → CLI flag template from `effort_flag`
#     Optional `effort_verified: validated|passthrough|documented` records how
#     the support was established. If omitted, effort is unsupported.
#     `validated` means the provider rejects out-of-enum values, proving it
#     parses the field. `passthrough` means acceptance is not proof the model
#     honors it; high effort there is a request, not a guarantee. `documented`
#     means the parameter and enum are read from official docs. Gemini and Groq
#     cap at `high`; Ollama's top level is `max`.
#   transports.edit_exists   — spawns a direct agent CLI in the caller's cwd.
#     This is the recommended path for iterative edits, multi-file work, and
#     tool use. The bundled registry intentionally uses direct CLIs here.
#     May stay a legacy bare string command, or be a map with:
#       cmd: "codex exec ..."
#       effort_levels: [low, medium, high, xhigh]
#       effort_flag: "-c model_reasoning_effort={level}"
#       effort_param: flag
#       effort_verified: validated|passthrough|documented
#     If `effort_levels` is absent, effort is unsupported for that transport.
#     `xhigh` currently exists only on Codex CLI.
# When both are present, `runAny` picks `generate_new` unless overridden.
# Request `edit_exists` for an in-place edit; direct CLIs can inspect the cwd,
# so attached files are optional on that transport.
#   transports.read_only     — same direct-CLI spawn as edit_exists, but the
#     command is the CLI's no-write invocation (a distinct trust list / sandbox
#     flag / disallowed-tools set, NOT the edit_exists cmd with a hopeful
#     instruction appended). Requesting `read_only` on an entry that does not
#     declare it is a hard error — it never falls back to a write-capable
#     command.
#     EVERY read_only block is explicit, and says HOW it is non-writing in
#     exactly one of two ways — the loader rejects an entry that gives neither
#     or both:
#       cmd: "<cli> <no-write invocation>"   — proven per-entry against a
#         canary by `external-agents verify-read-only <id>`.
#       via: generate_new                    — the entry has no CLI at all, so
#         its read-only role is served by its own HTTP transport. An OpenAI-
#         compatible completion call holds no filesystem handle of any kind,
#         so there is nothing to prove with a canary; `verified:
#         by_construction` records that basis, and verify-read-only returns it
#         rather than running a probe. `via` accepts ONLY generate_new —
#         pointing it at edit_exists is the write-capable fallback this axis
#         exists to prevent, and is rejected at load.
#     This used to be implicit: an entry with a generate_new transport and no
#     read_only block silently satisfied a read_only request. That worked, but
#     it made coverage unauditable — you could not tell a deliberately
#     read-only-capable entry from one nobody had considered.
#     A `read_only` cmd must be verified with `external-agents verify-read-only
#     <id>` (runs it against a canary file and confirms the file is
#     unchanged) before it is trusted — a command whose FLAGS merely look
#     non-writing is not proof; `claude --print --allowedTools Read,Grep,Glob`
#     looks read-only and still writes, because --allowedTools only ADDS
#     permissions and never restricts them. This axis exists because kiro was
#     dispatched under `edit_exists` with a read-only trust list: it degraded
#     silently to printing patches as prose, and dispatch reported
#     `outcome: success` for work that never happened. `read_only` gives
#     read-only dispatch (e.g. /consensus reviewers, which run in the live
#     repo they are judging) a declared, verified transport instead of a
#     write-capable command plus a prompt asking it to behave.
#
# Auth surfaces (2, merged from previous 3):
#   env:VAR   — external-agents reads the value from process.env.VAR
#   cli:tool  — the named CLI owns its own credential store (subscription
#               token, cookie, OAuth session; whatever `<tool> login` writes)
#
# Tags are opaque strings. UI styles `free` as a green $0 badge.
# Keep disabled paid entries narrow and justified: bundle them only when they
# reuse an already-bundled auth surface and act as a low-friction upgrade path.
# Env overrides live under `env:` (values may be "@file:~/path" refs).
#
# `usage_url` (existing) — where an operator checks live spend/quota for the
# credential this entry uses.
# `signup_url` (optional) — where an operator obtains this credential (an API
# key page, or the provider's account signup for a `cli:`-authenticated tool).
# `docs_url` (optional) — the provider's own API/CLI documentation.
# `free_tier` (optional) — plain-language description of what free usage this
# provider actually offers, so a consuming UI can explain it rather than just
# tag it `free`:
#   description    — a sentence or two, not a slogan.
#   limits          — the real caps, in words (exact numbers drift; don't pin
#                     a number here that will go stale).
#   card_required   — whether starting the free tier needs a payment method.
# All three are UI-facing catalog content, not auth or dispatch behavior — an
# entry with none of them still dispatches normally; a consumer falls back to
# "not documented yet" rather than treating their absence as an error.
schema_version: 1
agents:

  # ============ Google Gemini (AI Studio) ============
  # Trimmed 2026-08-06 to exactly 2 models per key (flash + pro): with a
  # project-wide gate discovered above the per-model RPM/RPD buckets (see the
  # google2 section below), stacking 5 flash variants under one key bought no
  # real redundancy — they all fail together once that gate trips. Real
  # redundancy comes from adding more KEYS (more independent project-wide
  # gates), not more models per key. Kept the newest non-preview, non-lite
  # flash generation; dropped the older/duplicate pro entry.
  - id: gemini-3.6-flash
    provider: google
    model: gemini-3.6-flash
    quota_scope: per_model
    tier: weak
    tags: [quick, free]
    auth: "env:GEMINI_API_KEY"
    preference_order: 10
    usage_url: "https://aistudio.google.com/usage"
    signup_url: "https://aistudio.google.com/apikey"
    docs_url: "https://ai.google.dev/gemini-api/docs"
    free_tier:
      description: "Google AI Studio issues a free API key with no credit card required. The free tier is rate-limited per minute and per day rather than metered by spend."
      limits: "Free-tier requests are capped per minute and per day; the caps vary by model and are shown on the usage console."
      card_required: false
    transports:
      edit_exists:
        cmd: "aider --model gemini/gemini-3.6-flash"
      read_only:
        via: generate_new
        verified: by_construction
      generate_new:
        url: "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
        env: GEMINI_API_KEY
        model: gemini-3.6-flash
        effort_param: top_level
        effort_levels: [none, minimal, low, medium, high]
        effort_verified: validated
  # Google removed Gemini Pro from the free tier (limit: 0). This paid
  # upgrade reuses the same GEMINI_API_KEY auth surface, so it stays bundled
  # but excluded from default picks via `paid` tag + `enabled: false`.
  - id: gemini-3.1-pro-preview
    provider: google
    model: gemini-3.1-pro-preview
    quota_scope: per_model
    tier: strong
    tags: [quick, paid]
    enabled: false
    auth: "env:GEMINI_API_KEY"
    usage_url: "https://aistudio.google.com/usage"
    signup_url: "https://aistudio.google.com/apikey"
    docs_url: "https://ai.google.dev/gemini-api/docs"
    free_tier:
      description: "Google AI Studio issues a free API key with no credit card required. The free tier is rate-limited per minute and per day rather than metered by spend."
      limits: "Free-tier requests are capped per minute and per day; the caps vary by model and are shown on the usage console."
      card_required: false
    transports:
      edit_exists:
        cmd: "aider --model gemini/gemini-3.1-pro-preview"
      read_only:
        via: generate_new
        verified: by_construction
      generate_new:
        url: "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
        env: GEMINI_API_KEY
        model: gemini-3.1-pro-preview
        effort_param: top_level
        effort_levels: [none, minimal, low, medium, high]
        effort_verified: validated
  # ============ Google Gemini (AI Studio, second project) ============
  # Same Google account, a DIFFERENT GCP project ("My Project 82450") and its
  # own GEMINI_API_KEY_2. Added 2026-08-06 after the gemini-* entries above
  # all went quota_exhausted at scattered times over ~1h (not one RPM burst),
  # meaning "Default Gemini Project" hit a project-wide gate, not a per-model
  # one — every model under that key/project fails together once it trips,
  # regardless of that model's own RPM/RPD headroom. Verified live: the exact
  # same gemini-3.5-flash call that 429'd on GEMINI_API_KEY returned 200 on
  # this key. `provider: google2` (not `google`) so pick's
  # min_distinct_providers diversity logic treats this as a genuinely
  # separate source, matching reality.
  - id: gemini-3.6-flash-2
    provider: google2
    model: gemini-3.6-flash
    quota_scope: per_model
    tier: weak
    tags: [quick, free]
    auth: "env:GEMINI_API_KEY_2"
    preference_order: 10
    usage_url: "https://aistudio.google.com/usage"
    docs_url: "https://ai.google.dev/gemini-api/docs"
    free_tier:
      description: "Second Google AI Studio project/key on the same account, used as a fallback when the primary project's key hits its project-wide free-tier gate."
      limits: "Free-tier requests are capped per minute and per day; the caps vary by model and are shown on the usage console."
      card_required: false
    transports:
      edit_exists:
        cmd: "aider --model gemini/gemini-3.6-flash"
        # aider takes its key name from LiteLLM's fixed table and will only
        # ever read GEMINI_API_KEY. This sibling's credential lives in
        # GEMINI_API_KEY_2, so without the mapping it would silently
        # authenticate as the FIRST Google key — the same quota this entry
        # exists to be independent of.
        env_from:
          GEMINI_API_KEY: GEMINI_API_KEY_2
      read_only:
        via: generate_new
        verified: by_construction
      generate_new:
        url: "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
        env: GEMINI_API_KEY_2
        model: gemini-3.6-flash
        effort_param: top_level
        effort_levels: [none, minimal, low, medium, high]
        effort_verified: validated
  - id: gemini-3.1-pro-preview-2
    provider: google2
    model: gemini-3.1-pro-preview
    quota_scope: per_model
    tier: strong
    tags: [quick, paid]
    enabled: false
    auth: "env:GEMINI_API_KEY_2"
    docs_url: "https://ai.google.dev/gemini-api/docs"
    free_tier:
      description: "Second Google AI Studio project/key on the same account, used as a fallback when the primary project's key hits its project-wide free-tier gate. Pro is off the free tier here too (limit: 0) — kept disabled to mirror the primary key."
      limits: "Free-tier requests are capped per minute and per day; the caps vary by model and are shown on the usage console."
      card_required: false
    transports:
      edit_exists:
        cmd: "aider --model gemini/gemini-3.1-pro-preview"
        # aider takes its key name from LiteLLM's fixed table and will only
        # ever read GEMINI_API_KEY. This sibling's credential lives in
        # GEMINI_API_KEY_2, so without the mapping it would silently
        # authenticate as the FIRST Google key — the same quota this entry
        # exists to be independent of.
        env_from:
          GEMINI_API_KEY: GEMINI_API_KEY_2
      read_only:
        via: generate_new
        verified: by_construction
      generate_new:
        url: "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
        env: GEMINI_API_KEY_2
        model: gemini-3.1-pro-preview
        effort_param: top_level
        effort_levels: [none, minimal, low, medium, high]
        effort_verified: validated

