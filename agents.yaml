  # Kiro CLI (AWS Kiro Studio's headless chat mode). The trust list must cover
  # every tool the transport promises: `edit_exists` means "edits files in
  # place", so fs_write is required, and execute_bash lets the agent run the
  # acceptance commands (typecheck, git diff) it is asked to report. Trusting
  # fs_read alone does NOT fail — kiro silently degrades to printing the patch
  # as text and exits 0 with no files touched, which reads as a success.
  # Requires prior `kiro-cli login`; state at ~/.aws/sso equivalent.
  - id: kiro
    provider: kiro
    model: default
    tier: strong
    tags: [agentic]
    auth: "cli:kiro-cli"
    signup_url: "https://kiro.dev"
    docs_url: "https://kiro.dev/docs"
    free_tier:
      description: "Kiro CLI authenticates with a Kiro account. The free tier includes a limited monthly credit allowance; paid plans raise it."
      limits: "Free-tier credits are capped per month and reset on the billing cycle."
      card_required: false
    transports:
      edit_exists:
        cmd: "kiro-cli chat --no-interactive --trust-tools=fs_read,fs_write,execute_bash"
        effort_param: flag
        effort_levels: [low, medium, high, xhigh, max]
        effort_flag: "--effort {level}"
        effort_verified: validated
      # Verified with `external-agents verify-read-only kiro`: a canary file
      # was demonstrably unchanged after dispatch. This is the ORIGINAL
      # edit_exists cmd from before this incident — trusting only fs_read is
      # exactly what makes it non-writing.
      read_only:
        cmd: "kiro-cli chat --no-interactive --trust-tools=fs_read"
        effort_param: flag
        effort_levels: [low, medium, high, xhigh, max]
        effort_flag: "--effort {level}"
        effort_verified: validated

  # ============ Primary orchestrator (subscription CLI) ============
  # These are strong-tier agentic CLIs backed by an operator subscription — not
  # API keys. `pick_agents` excludes strong-tier by default (weak-only filter),
  # so they are reached only via an explicit `dispatch <id>` call, typically as
  # the primary-orchestrator role or as `escalate_to_pro: true` on a weak-tier
  # dispatch that failed. Which of the two is "primary" is decided by the
  # consumer (mrrlin will make this operator-configurable in a later slice);
  # both are registered here so either can serve.
  # Codex family — every entry is explicit-model (no aliases). Live-verified
  # against a ChatGPT-plan account: the `-codex` family models
  # (gpt-5.4-codex, gpt-5.3-codex) return "not supported when using Codex with
  # a ChatGPT account" and gpt-5.6-terra returns "requires a newer version of
  # Codex". Only gpt-5.4-mini works on the free ChatGPT tier — keep just that
  # explicit entry plus the `codex` default (which lets the CLI choose whatever
  # the operator's plan actually exposes). Users on an OpenAI API-key plan can
  # add the -codex tiers back via `external-agents add-model`.
  #
  # `model: default` is intentionally NOT a real model id — it means "whatever
  # `codex exec` resolves to on this account", which varies by plan/tier and
  # WILL drift over time. As of 2026-07-23 on a ChatGPT-plan account it
  # resolved to "GPT-5" (confirmed by asking it directly). Don't hardcode that
  # in the UI — it's a snapshot, not a contract.
  - id: codex
    provider: openai
    model: default
    tier: strong
    tags: []
    auth: "cli:codex"
    usage_url: "https://platform.openai.com/usage"
    signup_url: "https://chatgpt.com/codex"
    docs_url: "https://developers.openai.com/codex/cli"
    free_tier:
      description: "Codex CLI authenticates with a ChatGPT account rather than a metered API key. Plus, Pro, Team and Enterprise plans include Codex usage; there is no unauthenticated free tier."
      limits: "Usage limits follow the linked ChatGPT plan's Codex allowance."
      card_required: true
    transports:
      edit_exists:
        cmd: "codex exec --skip-git-repo-check"
        effort_param: flag
        effort_levels: [low, medium, high, xhigh]
        effort_flag: "-c model_reasoning_effort={level}"
        effort_verified: validated

  - id: codex-gpt-5.4-mini
