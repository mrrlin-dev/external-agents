  - id: gemini-3.5-flash-lite
    provider: google
    model: gemini-3.5-flash-lite
    quota_scope: per_model
    tier: weak
    tags: [quick, cheap, free]
    auth: "env:GEMINI_API_KEY"
    preference_order: 5
    usage_url: "https://aistudio.google.com/usage"
    signup_url: "https://aistudio.google.com/apikey"
    docs_url: "https://ai.google.dev/gemini-api/docs"
    free_tier:
      description: "Google AI Studio issues a free API key with no credit card required. The free tier is rate-limited per minute and per day rather than metered by spend."
      limits: "Free-tier requests are capped per minute and per day; the caps vary by model and are shown on the usage console."
      card_required: false
    transports:
      generate_new:
        url: "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
        env: GEMINI_API_KEY
        model: gemini-3.5-flash-lite
