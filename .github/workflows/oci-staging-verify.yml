name: OCI Staging Verification

on:
  workflow_dispatch:

concurrency:
  group: oci-staging-verify
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, arm64, oci-staging-runner]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run test suite
        run: npm test

      - name: Verify package can be packed
        run: npm pack --dry-run
