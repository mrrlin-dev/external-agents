name: Release

# Publishing is manual on purpose: a merge to main is not a decision to ship.
# The operator dispatches this workflow when main holds the version they mean
# to release, and the guard below refuses if that version is already on npm —
# so a second dispatch stops with a clear message instead of a 403 from the
# registry after the tests have already run.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every check and pack the tarball, but do not publish"
        type: boolean
        default: false

# id-token is what makes this work without an NPM_TOKEN: npm exchanges this
# short-lived OIDC token for publish rights via trusted publishing, and stamps
# the package with provenance in the same step. contents:write is only for the
# v<version> tag written after a successful publish.
permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >= 11.5.1; setup-node with node 22
      # still ships npm 10.x, so upgrade rather than hope — and assert the
      # result, because a silent 10.x here fails later as an opaque 404/403.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          NPM_V="$(npm -v)"
          echo "npm $NPM_V"
          NPM_V="$NPM_V" node -e '
            const need = [11, 5, 1];
            const got = process.env.NPM_V.split(".").map(Number);
            for (let i = 0; i < 3; i++) {
              if (got[i] > need[i]) break;
              if (got[i] < need[i]) {
                console.error(`npm ${process.env.NPM_V} is below the 11.5.1 that trusted publishing requires`);
                process.exit(1);
              }
            }
          '

      - name: Resolve version and refuse a republish
        id: version
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          NAME="$(node -p 'require("./package.json").name')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $NAME@$VERSION"

          # `npm view <pkg>@<version> version` prints the version when it is
          # already published and prints nothing when it is not.
          PUBLISHED="$(npm view "$NAME@$VERSION" version 2>/dev/null || true)"
          if [ -n "$PUBLISHED" ]; then
            echo "::error::$NAME@$VERSION is already on npm — bump the version in package.json first"
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # The same gates CI runs on every push. A release must not be the one
      # build nobody checked, and re-running them here costs seconds.
      - name: Unit tests
        run: node --test lib/*.test.js

      - name: Registry loads
        run: node -e 'import("./lib/registry.js").then(m => { const r = m.loadRegistry("./agents.yaml"); if (!r.agents.length) throw new Error("empty registry"); console.log(`loaded ${r.agents.length} agents`); })'

      # Packs exactly what `files` in package.json selects, so an accidental
      # inclusion is visible in the log before it is public and permanent.
      - name: Show tarball contents
        run: npm pack --dry-run

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public --provenance

      - name: Tag the published commit
        if: ${{ !inputs.dry_run }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists on origin; leaving it alone"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The publish already succeeded by this point. Say so loudly if the
          # tag is what fails, so nobody re-dispatches a release that shipped.
          if ! git tag -a "$TAG" -m "$TAG" || ! git push origin "$TAG"; then
            echo "::error::${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }} WAS PUBLISHED, but tagging $TAG failed. Do not re-run this workflow; create the tag by hand."
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "### ${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "Dry run — checks passed, nothing published."
            else
              echo "Published to npm with provenance, tagged \`${{ steps.version.outputs.tag }}\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
